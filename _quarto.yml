project:
  type: website
  output-dir: _site
  # Run all notebooks from the project root so relative paths like
  # `data/NEU-DET/...` resolve the same way they do for `pytest` / `python -m`.
  execute-dir: project

website:
  title: "Ai4MatLectures"
  navbar:
    left:
      - href: index.qmd
        text: Home

execute:
  freeze: auto

format:
  html:
    css: styles.css
    fontsize: 14pt
    theme:
      - darkly
      - custom.scss
    toc: true
    code-fold: false
